<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Конфигурация оружия — Unity Remote Config</title>
<style>body{font:18px system-ui;background:#f4f6fa;color:#1e293b;max-width:900px;margin:60px auto;padding:24px}table{border-collapse:collapse;width:100%;background:white}td,th{text-align:left;padding:18px;border-bottom:1px solid #d8dee9}pre{background:#172033;color:#e2e8f0;padding:24px;border-radius:12px;overflow:auto}a{color:#2563eb}</style>
<h1>Удалённая конфигурация оружия</h1>
<p>Источник: <a href="weapons.json">weapons.json</a> · <span id="status">Загрузка…</span></p>
<table><thead><tr><th>id</th><th>damage</th><th>cooldown</th></tr></thead><tbody id="rows"></tbody></table>
<h2>JSON на сервере</h2><pre id="json"></pre>
<script>
fetch('weapons.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(config=>{
 document.getElementById('status').textContent='schema_version: '+config.schema_version+' · config_version: '+config.config_version;
 document.getElementById('json').textContent=JSON.stringify(config,null,2);
 for(const weapon of config.weapons){const tr=document.createElement('tr');for(const key of ['id','damage','cooldown']){const td=document.createElement('td');td.textContent=weapon[key];tr.append(td)}document.getElementById('rows').append(tr)}
}).catch(e=>document.getElementById('status').textContent='Не удалось загрузить конфиг: '+e.message);
</script>
</html>
